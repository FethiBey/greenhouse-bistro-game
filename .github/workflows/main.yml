name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Mobile Project and Build
        run: |
          cordova create myapp com.greenhouse.bistro "Greenhouse Bistro"
          cd myapp
          rm -rf www/*
          cp ../index.html www/
          cp ../logo.png www/icon.png
          sed -i 's|</widget>|    <icon src="www/icon.png" />\n</widget>|' config.xml
          cordova platform add android --no-telemetry
          cordova build android --debug --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Greenhouse-Bistro-Game-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
